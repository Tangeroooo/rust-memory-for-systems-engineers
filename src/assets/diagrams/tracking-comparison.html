<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ allocator 통제와 Rust reservation의 경계</title>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Fira+Sans:wght@400;500;600&amp;family=Source+Code+Pro:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root { --paper: #fafaf7; --ink: #2a3439; --muted: #59656a; --accent: #a72145; }
    body { background: var(--paper); color: var(--ink); font-family: 'Fira Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    main { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    text { fill: var(--ink); font-family: 'Fira Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 16px; }
    .display { font-family: 'Alfa Slab One', 'Noto Sans KR', sans-serif; font-size: 28px; font-weight: 400; }
    .heading { font-size: 24px; font-weight: 600; }
    .label { font-size: 20px; font-weight: 500; }
    .small { font-size: 12px; fill: var(--muted); }
    .code { font-family: 'Source Code Pro', monospace; font-size: 16px; }
    .process { fill: #f5f5f2; stroke: #b8c0c3; stroke-width: 1; }
    .heap { fill: #e1e6e2; stroke: #b8c0c3; stroke-width: 1; }
    .cap { fill: #fafaf7; stroke: var(--ink); stroke-width: 2; }
    .storage { fill: #edf0ed; stroke: #b8c0c3; stroke-width: 1; }
    .risk { fill: #faedf0; stroke: var(--accent); stroke-width: 1; }
    .outside { fill: #f5f5f2; stroke: #b8c0c3; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
</head>
<body>
<main>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracking-comparison-title tracking-comparison-desc">
  <title id="tracking-comparison-title">C++ allocator 통제와 Rust reservation의 경계</title>
  <desc id="tracking-comparison-desc">왼쪽 C++ 구성에서는 자체 buffer와 연결된 외부 library가 전용 allocator의 cap 안에 있다. Allocate와 deallocate를 통해 컴포넌트별 metric을 갱신하고 한도 초과를 bad_alloc으로 전달한다. 오른쪽 Rust 혼합 구성에서는 자체 buffer만 명시적인 reservation과 charge에 연결되어 있다. 외부 crate의 Vec 및 String allocation도 global allocator에서 합계 계측은 가능하지만 task reservation에는 자동 반영되지 않으며, infallible 경로의 기본 OOM 동작은 process abort다. 양쪽 모두 선택한 allocator 밖의 stack, mmap, 다른 allocator 경로가 남는다. 하단은 실제 메모리 영역이 아닌 예산 배분으로, 관리 예산과 별도 여유인 headroom을 구분한다. 면적은 실제 byte 비율이 아니다.</desc>
  <defs>
    <pattern id="tracking-headroom" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f5f5f2"/>
      <path d="M -4 4 L 4 -4 M 0 8 L 8 0 M 4 12 L 12 4" fill="none" stroke="#b8c0c3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#fafaf7"/>
  <text x="40" y="48" class="display">Memory control</text>
  <text x="40" y="80" class="label">같은 heap에서도, budget이 닿는 범위는 다르다.</text>

  <text x="64" y="132" class="heading">C++ · allocator-aware 구성</text>
  <rect class="process" x="40" y="152" width="576" height="352" rx="8"/>
  <rect class="heap" x="64" y="176" width="528" height="248" rx="8"/>
  <text x="88" y="208" class="label">컴포넌트별 metric</text>
  <!-- Participating components share a cap; their requests update counters. -->
  <rect class="cap" x="88" y="232" width="480" height="168" rx="8"/>
  <text x="104" y="264" class="label">전용 allocator · 자동 계측 + cap</text>
  <rect class="storage" x="104" y="288" width="204" height="88" rx="8"/>
  <text x="120" y="320" class="label">자체 buffer</text>
  <text x="120" y="352" class="code">alloc / dealloc</text>
  <rect class="storage" x="324" y="288" width="228" height="88" rx="8"/>
  <text x="340" y="320" class="label">연결된 library</text>
  <text x="340" y="352" class="code">alloc / dealloc</text>
  <rect class="outside" x="64" y="444" width="528" height="40" rx="8"/>
  <text x="80" y="472">통제 밖 · 미연결 library / stack / mmap</text>

  <text x="688" y="132" class="heading">Rust · fallible + infallible 혼합</text>
  <rect class="process" x="664" y="152" width="576" height="352" rx="8"/>
  <rect class="heap" x="688" y="176" width="528" height="248" rx="8"/>
  <text x="712" y="208" class="label">GlobalAlloc에서 합계 계측 가능</text>
  <!-- Observable globally does not mean charged to a task reservation. -->
  <rect class="cap" x="712" y="232" width="216" height="168" rx="8"/>
  <text x="728" y="264" class="label">Reserve · charge</text>
  <rect class="storage" x="728" y="288" width="184" height="88" rx="8"/>
  <text x="744" y="320" class="label">자체 buffer</text>
  <text x="744" y="352" class="code">fallible grow</text>
  <rect class="risk" x="952" y="232" width="240" height="168" rx="8"/>
  <text x="968" y="264" class="label">Reserve 계측 밖</text>
  <text x="968" y="320" class="label">외부 crate</text>
  <text x="968" y="352" class="code">Vec / String</text>

  <rect class="outside" x="688" y="444" width="528" height="40" rx="8"/>
  <text x="704" y="472">Allocator 밖 · stack / mmap / native</text>

  <text x="64" y="536" class="small">CAP 초과 · ALLOCATION 실패</text>
  <text x="64" y="568" class="heading">throw bad_alloc → task 복구</text>
  <text x="728" y="536" class="small">명시적 FALLIBLE 경로</text>
  <text x="728" y="568" class="heading">Err → task 복구</text>
  <text x="968" y="536" class="small">INFALLIBLE OOM · 기본 std</text>
  <text x="968" y="568" class="heading" style="fill:#a72145">process abort</text>

  <!-- Budget planning is deliberately separate from memory containment. -->
  <text x="64" y="608" class="small">예산 배분 · 실제 사용량 아님</text>
  <rect x="64" y="620" width="352" height="36" fill="#e1e6e2" stroke="#2a3439"/>
  <text x="240" y="644" text-anchor="middle">Allocator 관리 예산</text>
  <rect x="416" y="620" width="176" height="36" fill="url(#tracking-headroom)" stroke="#b8c0c3"/>
  <rect x="456" y="624" width="96" height="28" fill="#fafaf7"/>
  <text x="504" y="644" text-anchor="middle">Headroom</text>
  <text x="688" y="608" class="small">예산 배분 · 실제 사용량 아님</text>
  <rect x="688" y="620" width="352" height="36" fill="#e1e6e2" stroke="#2a3439"/>
  <text x="864" y="644" text-anchor="middle">Reservation 관리 예산</text>
  <rect x="1040" y="620" width="176" height="36" fill="url(#tracking-headroom)" stroke="#b8c0c3"/>
  <rect x="1080" y="624" width="96" height="28" fill="#fafaf7"/>
  <text x="1128" y="644" text-anchor="middle">Headroom</text>

  <rect x="64" y="688" width="16" height="16" fill="#fafaf7" stroke="#2a3439" stroke-width="2"/>
  <text x="92" y="704">명시적으로 집행하는 경계</text>
  <rect x="456" y="688" width="16" height="16" fill="#faedf0" stroke="#a72145"/>
  <text x="484" y="704">계측 가능 ≠ reservation 연결</text>
  <rect x="896" y="688" width="16" height="16" fill="url(#tracking-headroom)" stroke="#b8c0c3"/>
  <text x="924" y="704">Headroom = 별도 여유 예산</text>
</svg>
</main>
</body>
</html>
