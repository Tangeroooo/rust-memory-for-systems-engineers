name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Check book structure
        run: python3 scripts/check-book.py
      - name: Test examples
        run: cargo test --workspace --all-targets
      - name: Run Linux anonymous memory lab
        run: cargo run -p memory-lab --bin linux_anonymous --quiet
      - name: Test Rust snippets
        run: mdbook test
      - name: Build book
        run: mdbook build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
